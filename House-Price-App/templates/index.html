<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>House Price Predictor</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f3ef;
    --surface: #ffffff;
    --border: #e2ddd6;
    --text-primary: #1a1714;
    --text-muted: #7a746b;
    --accent: #1a1a2e;
    --accent-hover: #e94560;
    --gold: #c9951a;
    --radius: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.6rem;
    color: var(--accent);
    letter-spacing: -0.02em;
    line-height: 1.15;
  }

  header p {
    color: var(--text-muted);
    margin-top: 0.5rem;
    font-size: 1rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow);
  }

  .section-label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem 1.5rem;
  }

  .grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1rem 1.5rem;
  }

  @media (max-width: 640px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    header h1 { font-size: 1.9rem; }
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  label {
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-muted);
  }

  input[type="number"],
  select {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    padding: 0.55rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #faf9f7;
    color: var(--text-primary);
    width: 100%;
    transition: border-color 0.2s, box-shadow 0.2s;
    appearance: none;
    -webkit-appearance: none;
  }

  input[type="number"]:focus,
  select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(26,26,46,0.1);
    background: #fff;
  }

  .slider-field {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .slider-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .slider-top label { font-size: 0.82rem; font-weight: 500; color: var(--text-muted); }
  .slider-val { font-size: 0.9rem; font-weight: 600; color: var(--accent); min-width: 24px; text-align: right; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 5px;
    border-radius: 10px;
    background: #e2ddd6;
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    transition: background 0.2s;
  }

  input[type="range"]:hover::-webkit-slider-thumb {
    background: var(--accent-hover);
  }

  .select-wrap {
    position: relative;
  }

  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 0.9rem;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    color: var(--text-muted);
    font-size: 0.75rem;
  }

  .predict-btn {
    width: 100%;
    padding: 0.85rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    letter-spacing: 0.01em;
    margin-top: 0.5rem;
  }

  .predict-btn:hover { background: var(--accent-hover); }
  .predict-btn:active { transform: scale(0.99); }

  .result-box {
    display: none;
    background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
    border-radius: 14px;
    padding: 2.2rem;
    text-align: center;
    margin-top: 1.5rem;
    animation: fadeUp 0.4s ease;
  }

  .result-box.visible { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result-label {
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8899aa;
    font-weight: 600;
    margin-bottom: 0.6rem;
  }

  .result-price {
    font-family: 'DM Serif Display', serif;
    font-size: 3rem;
    color: #f5c518;
    line-height: 1;
    margin-bottom: 0.6rem;
  }

  .result-note {
    font-size: 0.8rem;
    color: #667788;
    margin-top: 0.5rem;
  }

  .range-strip {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-top: 1.2rem;
    padding-top: 1.2rem;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  .range-item { text-align: center;}
  .range-item .ri-label { font-size: 0.7rem; color: #667788; letter-spacing: 0.08em; text-transform: uppercase; }
  .range-item .ri-val { font-size: 0.95rem; font-weight: 600; color: #aabbcc; margin-top: 0.2rem; }

  hr.divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1.5rem 0;
  }
</style>
</head>
<body>
  
<div class="container">
  <header>
    <h1>🏠 House Price Predictor</h1>
    <p>Enter property details below to get an instant price estimate.</p>
  </header>

  <!-- Property Size -->
  <div class="card">
    <div class="section-label">📐 Property size</div>
    <div class="grid-2">
      <div class="field">
        <label for="area">Area (sq ft)</label>
        <input type="number" id="area" value="1500" min="100" step="50"/>
      </div>
      <div class="field">
        <label for="bedrooms">Bedrooms</label>
        <input type="number" id="bedrooms" value="3" min="1"/>
      </div>
      <div class="field">
        <label for="bathrooms">Bathrooms</label>
        <input type="number" id="bathrooms" value="2" min="1"/>
      </div>
      <div class="field">
        <label for="floors">Floors</label>
        <input type="number" id="floors" value="1" min="1"/>
      </div>
      <div class="field">
        <label for="garage">Garage (cars)</label>
        <input type="number" id="garage" value="1" min="0"/>
      </div>
      <div class="field">
        <label for="parking">Parking spots</label>
        <input type="number" id="parking" value="1" min="0"/>
      </div>
      <div class="field">
        <label for="garden">Garden area (sq ft)</label>
        <input type="number" id="garden" value="100" min="0" step="10"/>
      </div>
      <div class="field">
        <label for="age">Age of property (years)</label>
        <input type="number" id="age" value="5" min="0"/>
      </div>
    </div>
  </div>

  <!-- Location -->
  <div class="card">
    <div class="section-label">📍 Location &amp; neighbourhood</div>
    <div class="grid-2">
      <div class="field">
        <label for="location">Location type</label>
        <div class="select-wrap">
          <select id="location">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="premium">Premium</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="income_level">Area income level</label>
        <div class="select-wrap">
          <select id="income_level">
            <option value="high" selected>High</option>
            <option value="low">Low</option>
            <option value="mid">Mid</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="distance">Distance to city centre (km)</label>
        <input type="number" id="distance" value="5.0" min="0" step="0.5"/>
      </div>
      <div class="field">
        <label for="crime_rate">Crime rate (0–1)</label>
        <input type="number" id="crime_rate" value="0.2" min="0" max="1" step="0.01"/>
      </div>
      <div class="field">
        <label for="population_density">Population density</label>
        <input type="number" id="population_density" value="5000" min="0" step="100"/>
      </div>
      <div>&nbsp;</div>
    </div>

    <hr class="divider"/>

    <div class="grid-2">
      <div class="slider-field">
        <div class="slider-top">
          <label>Security rating (1–10)</label>
          <span class="slider-val" id="security-val">7</span>
        </div>
        <input type="range" id="security" min="1" max="10" value="7" step="1"
               oninput="document.getElementById('security-val').textContent=this.value"/>
      </div>
      <div class="slider-field">
        <div class="slider-top">
          <label>Schools nearby</label>
          <span class="slider-val" id="schools-val">3</span>
        </div>
        <input type="range" id="school_nearby" min="0" max="10" value="3" step="1"
               oninput="document.getElementById('schools-val').textContent=this.value"/>
      </div>
      <div class="slider-field">
        <div class="slider-top">
          <label>Hospitals nearby</label>
          <span class="slider-val" id="hospitals-val">2</span>
        </div>
        <input type="range" id="hospital_nearby" min="0" max="10" value="2" step="1"
               oninput="document.getElementById('hospitals-val').textContent=this.value"/>
      </div>
      <div class="slider-field">
        <div class="slider-top">
          <label>Shopping malls nearby</label>
          <span class="slider-val" id="malls-val">2</span>
        </div>
        <input type="range" id="shopping_mall_nearby" min="0" max="10" value="2" step="1"
               oninput="document.getElementById('malls-val').textContent=this.value"/>
      </div>
      <div class="slider-field">
        <div class="slider-top">
          <label>Public transport score (1–10)</label>
          <span class="slider-val" id="transport-val">6</span>
        </div>
        <input type="range" id="public_transport" min="1" max="10" value="6" step="1"
               oninput="document.getElementById('transport-val').textContent=this.value"/>
      </div>
    </div>
  </div>

  <!-- Predict -->
  <button class="predict-btn" onclick="predict()">💰 Predict House Price</button>

  <!-- Result -->
  <div class="result-box" id="result-box">
    <div class="result-label">Estimated House Price</div>
    <div class="result-price" id="result-price">—</div>
    <div class="result-note">Simulated estimate based on your inputs · Linear-style model</div>
    <div class="range-strip">
      <div class="range-item">
        <div class="ri-label">Low estimate</div>
        <div class="ri-val" id="low-est">—</div>
      </div>
      <div class="range-item">
        <div class="ri-label">Mid estimate</div>
        <div class="ri-val" id="mid-est">—</div>
      </div>
      <div class="range-item">
        <div class="ri-label">High estimate</div>
        <div class="ri-val" id="high-est">—</div>
      </div>
    </div>
  </div>
</div>

<script>
  function v(id) {
    return parseFloat(document.getElementById(id).value) || 0;
  }
  function s(id) {
    const el = document.getElementById(id);
    return el ? el.value : '';
  }
  function fmt(n) {
    return '₹ ' + Math.round(n).toLocaleString('en-IN');
  }
  function predict() {

    const payload = {
      area: v("area"),
      bedrooms: v("bedrooms"),
      bathrooms: v("bathrooms"),
      floors: v("floors"),
      age: v("age"),
      distance: v("distance"),
      garage: v("garage"),
      parking: v("parking"),
      garden: v("garden"),
      security: v("security"),
      school_nearby: v("school_nearby"),
      hospital_nearby: v("hospital_nearby"),
      shopping_mall_nearby: v("shopping_mall_nearby"),
      public_transport: v("public_transport"),
      crime_rate: v("crime_rate"),
      population_density: v("population_density"),
      location: s("location"),
      income_level: s("income_level"),
    };

    fetch("http://127.0.0.1:5000/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json"},
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      document.getElementById("result-box").classList.add("visible");
      document.getElementById("result-price").innerText =
        "₹ " + data.price.toLocaleString("en-IN");
    })
    .catch(err => alert("Prediction failed"));
    }

</script>
</body>
</html>
